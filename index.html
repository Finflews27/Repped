<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Repped">
<meta name="theme-color" content="#16191d">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Repped</title>
<style>
/* Plate colours do the semantic work: red = primary action, yellow = warm-up,
   blue = drop set, green = done / PR. Everything else stays graphite and chalk. */
:root{
  --bg:#1c2025; --rail:#16191d; --panel:#242930; --panel2:#2c323a; --line:#353c46;
  --chalk:#ecebe6; --muted:#9aa1ab; --dim:#6b7380;
  --red:#d9463b; --red2:#b8372e; --yellow:#e8b931; --blue:#3f7fd9; --green:#3bb273; --greenbg:rgba(59,178,115,.14);
  --head:"Bahnschrift","DIN Alternate","DIN Condensed","Roboto Condensed","Arial Narrow",sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--chalk);font:14px/1.45 var(--body)}
body{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
input,textarea,select{font:inherit;color:var(--chalk)}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--head);font-weight:600;letter-spacing:.01em;margin:0}
h1{font-size:30px;line-height:1.1}
h2{font-size:20px}
h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)}
.dim{color:var(--dim)}

#app{display:grid;grid-template-columns:200px 1fr;height:100vh}
#rail{background:var(--rail);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 20px}
.brand b{font-family:var(--head);font-size:24px;font-weight:700;letter-spacing:.02em}
.brand svg{flex:none}
.navb{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 10px;border-radius:7px;color:var(--muted);font-size:14.5px}
.navb:hover{background:var(--panel);color:var(--chalk)}
.navb.on{background:var(--panel2);color:var(--chalk)}
.navb svg{width:18px;height:18px;flex:none}
.rail-foot{margin-top:auto;padding:10px 8px 0;border-top:1px solid var(--line);font-size:12.5px}
.rail-foot .fold{display:flex;align-items:center;gap:7px;color:var(--muted);word-break:break-all}
.dot{width:8px;height:8px;border-radius:50%;background:var(--green);flex:none}
.dot.off{background:var(--red)}

#main{overflow:auto;position:relative}
.page{max-width:900px;margin:0 auto;padding:30px 32px 120px}
.page.wide{max-width:1200px}
.toprow{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:22px}
.sub{color:var(--muted);margin-top:4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:8px 14px;border-radius:7px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:13.5px;white-space:nowrap}
.btn:hover{border-color:#4a5260}
.btn.red{background:var(--red);border-color:var(--red);color:#fff}
.btn.red:hover{background:var(--red2)}
.btn.green{background:var(--green);border-color:var(--green);color:#0f2418}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.ghost:hover{color:var(--chalk);background:var(--panel)}
.btn.danger{color:#ff8a80}
.btn.big{padding:12px 20px;font-size:15px}
.btn:disabled{opacity:.45;cursor:default}
.ibtn{padding:5px 8px;border-radius:6px;color:var(--muted);font-size:13px}
.ibtn:hover{background:var(--panel2);color:var(--chalk)}

.field{display:flex;flex-direction:column;gap:5px;margin-bottom:14px}
.field label{font-size:12.5px;color:var(--muted)}
.inp{background:var(--bg);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%}
.inp:focus{border-color:var(--blue);outline:none}
textarea.inp{resize:vertical;min-height:60px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1}

/* ---------- Workout home ---------- */
.startbar{display:flex;gap:12px;align-items:center;margin-bottom:34px;padding:18px 20px;background:var(--panel);border-radius:12px;border-left:4px solid var(--red)}
.startbar .grow p{color:var(--muted);font-size:13px}
.sechead{display:flex;align-items:center;justify-content:space-between;margin:0 0 12px}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:130px}
.tcard:hover{border-color:#4d5664}
.tcard h3{font-size:17px}
.tcard ul{list-style:none;margin:0;padding:0;color:var(--muted);font-size:13px;line-height:1.55}
.tcard .last{margin-top:auto;font-size:12px;color:var(--dim)}
.empty{border:1px dashed var(--line);border-radius:10px;padding:28px;text-align:center;color:var(--muted)}
.empty .btn{margin-top:12px}

/* ---------- Editor ---------- */
.edhead{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 0 12px;margin-bottom:8px;border-bottom:1px solid var(--line);display:flex;gap:14px;align-items:center}
.wname{font-family:var(--head);font-size:26px;font-weight:600;background:none;border:0;border-bottom:1px dashed transparent;padding:2px 0;min-width:0;flex:1}
.wname:hover,.wname:focus{border-bottom-color:var(--line);outline:none}
.clock{font-family:var(--head);font-size:22px;color:var(--muted)}
.pastrow{display:flex;gap:12px;margin:10px 0 4px;flex-wrap:wrap}
.pastrow .field{margin:0}
.wnotes{margin:10px 0 6px}
.exb{background:var(--panel);border-radius:12px;padding:12px 14px 10px;margin-top:14px}
.exh{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.exn{font-family:var(--head);font-size:18px;font-weight:600;color:#8db7ff;cursor:pointer;flex:1}
.exn:hover{text-decoration:underline}
.exn small{font-family:var(--body);font-size:12px;color:var(--dim);font-weight:400;margin-left:6px}
.exnote{margin:2px 0 8px;font-size:13px;min-height:36px}
table.sets{width:100%;border-collapse:separate;border-spacing:0 3px}
table.sets th{font-size:11.5px;color:var(--dim);font-weight:600;text-align:center;padding:2px 4px}
table.sets th.l,table.sets td.l{text-align:left}
table.sets td{padding:3px 4px;text-align:center}
table.sets tr td:first-child{border-radius:7px 0 0 7px}
table.sets tr td:last-child{border-radius:0 7px 7px 0}
table.sets tr.done td{background:var(--greenbg)}
.kind{width:30px;height:28px;border-radius:6px;background:var(--panel2);font-weight:700;font-family:var(--head);font-size:15px}
.kind.w{color:#1d1600;background:var(--yellow)}
.kind.d{color:#fff;background:var(--blue)}
.kind.f{color:#fff;background:var(--red)}
.prev{color:var(--dim);font-size:13px;cursor:pointer;white-space:nowrap}
.prev:hover{color:var(--muted)}
.sin{width:100%;max-width:96px;text-align:center;background:var(--panel2);border:1px solid transparent;border-radius:6px;padding:5px 4px;font-variant-numeric:tabular-nums;font-weight:600}
.sin:focus{border-color:var(--blue);outline:none}
.sin::placeholder{color:var(--dim);font-weight:400}
tr.done .sin{background:transparent}
.chk{width:34px;height:28px;border-radius:6px;background:var(--panel2);color:var(--dim);font-weight:700}
.chk:hover{color:var(--chalk)}
tr.done .chk{background:var(--green);color:#0f2418}
.sdel{color:var(--dim);opacity:0;padding:4px 6px}
tr:hover .sdel,.sdel:focus{opacity:1}
.sdel:hover{color:#ff8a80}
.addset{width:100%;margin-top:4px;padding:6px;border-radius:7px;background:var(--panel2);color:var(--muted);font-size:13px;font-weight:600}
.addset:hover{color:var(--chalk)}
.edfoot{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.edfoot .btn{width:100%}

/* rest timer */
#restbar{position:fixed;left:200px;right:0;bottom:0;z-index:20;background:var(--rail);border-top:1px solid var(--line);display:none}
#restbar.on{display:block}
#restbar .in{max-width:900px;margin:0 auto;padding:10px 32px;display:flex;align-items:center;gap:12px}
#restbar .t{font-family:var(--head);font-size:24px;min-width:70px}
#restbar .track{flex:1;height:6px;border-radius:3px;background:var(--panel2);overflow:hidden}
#restbar .fill{height:100%;background:var(--blue);width:0}
#resume{position:fixed;left:200px;right:0;bottom:0;z-index:19;display:none}
#resume.on{display:block}
#resume .in{max-width:900px;margin:0 auto 14px;padding:0 32px}
#resume button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-radius:10px;background:var(--red);color:#fff;font-weight:600}

/* ---------- History ---------- */
.month{font-family:var(--head);font-size:15px;color:var(--muted);margin:26px 0 10px}
.hcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;margin-bottom:10px;cursor:pointer;width:100%;text-align:left;display:block}
.hcard:hover{border-color:#4d5664}
.hcard .top{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.hcard .meta{display:flex;gap:16px;color:var(--muted);font-size:12.5px;margin:4px 0 8px}
.hcard table{width:100%;font-size:13px;border-collapse:collapse}
.hcard td{padding:1px 0;color:var(--muted)}
.hcard td:first-child{color:var(--chalk)}
.hcard td:last-child{text-align:right}
.pr{color:var(--yellow);font-weight:700;font-size:12px}

/* ---------- Exercises ---------- */
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.chip{padding:5px 11px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;color:var(--muted)}
.chip.on{background:var(--chalk);color:var(--bg);border-color:var(--chalk);font-weight:600}
.exrow{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:8px;width:100%;text-align:left}
.exrow:hover{background:var(--panel)}
.exrow .n{flex:1}
.exrow .n small{display:block;color:var(--dim);font-size:12px}
.cat{font-family:var(--head);font-size:15px;color:var(--muted);margin:18px 0 4px;padding-left:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:18px 0}
.stat{background:var(--panel);border-radius:10px;padding:12px 14px}
.stat b{display:block;font-family:var(--head);font-size:22px;font-weight:600}
.stat span{color:var(--muted);font-size:12.5px}
.chart{background:var(--panel);border-radius:10px;padding:14px;margin-bottom:18px}
.chart svg{width:100%;height:180px;display:block}

/* ---------- Print planner ---------- */
.pgrid{display:grid;grid-template-columns:330px 1fr;gap:26px;align-items:start}
.pside{position:sticky;top:20px}
.pbox{background:var(--panel);border-radius:12px;padding:16px;margin-bottom:14px}
.pbox h3{margin-bottom:10px}
.addlist{display:flex;flex-wrap:wrap;gap:6px}
.series{list-style:none;margin:0;padding:0}
.series li{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;background:var(--panel2);margin-bottom:5px;font-size:13.5px}
.series li .n{flex:1}
.series li .k{font-family:var(--head);color:var(--dim);width:18px}
.chkline{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13.5px}
.chkline input[type=number]{width:56px}
.paperwrap{background:#0f1114;border-radius:12px;padding:22px;overflow:auto}
.paper{background:#fff;color:#111;width:210mm;min-height:297mm;margin:0 auto 18px;padding:10mm;box-shadow:0 4px 18px rgba(0,0,0,.35)}

/* ---------- Modal + toast ---------- */
#modal{position:fixed;inset:0;background:rgba(5,7,10,.62);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:8vh 16px;overflow:auto}
#modal.on{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:520px;padding:20px 22px;box-shadow:0 18px 50px rgba(0,0,0,.5)}
.mbox.wide{max-width:680px}
.mbox h2{margin-bottom:10px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.plist{max-height:46vh;overflow:auto;margin:10px -6px 0}
.plist label{display:flex;align-items:center;gap:10px;padding:7px 8px;border-radius:7px;cursor:pointer}
.plist label:hover{background:var(--panel2)}
.plist label small{color:var(--dim);margin-left:auto;font-size:12px}
.plist label.sel{background:var(--panel2)}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--chalk);color:var(--bg);padding:9px 16px;border-radius:8px;font-weight:600;z-index:60;display:none;max-width:80vw}
#toast.on{display:block}
#toast.err{background:var(--red);color:#fff}

/* ---------- Connect screen ---------- */
.connect{max-width:560px;margin:12vh auto;padding:0 24px}
.connect h1{font-size:44px;margin-bottom:8px}
.connect .lead{color:var(--muted);font-size:15px;margin-bottom:26px}
.connect .tree{background:var(--panel);border-radius:10px;padding:14px 18px;font-size:13px;color:var(--muted);margin:20px 0;line-height:1.7}
.connect .tree b{color:var(--chalk);font-weight:600}

/* ---------- Printable sheet (shared by preview + print) ---------- */
.sheet{font-family:var(--head);color:#111}
.sheet .stitle{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:2mm;margin-bottom:4mm}
.sheet .stitle b{font-size:15pt}
.sheet .stitle span{font-family:var(--body);font-size:8pt;color:#555}
.ps{break-inside:avoid;page-break-inside:avoid;border:1px solid #999;border-radius:2mm;padding:2.5mm 3mm 2mm;margin-bottom:3.5mm}
.ps header{display:flex;align-items:baseline;gap:4mm;margin-bottom:1.5mm}
.ps header b{font-size:12pt;flex:1}
.ps header .no{font-size:9pt;color:#666}
.ps header .ln{font-family:var(--body);font-size:7.5pt;color:#555;display:flex;align-items:flex-end;gap:1mm}
.ps header .ln i{display:inline-block;border-bottom:1px solid #888;width:20mm;height:3.4mm}
.ps header .ln i.s{width:11mm}
.ps table{width:100%;border-collapse:separate;border-spacing:1mm .9mm;table-layout:fixed;margin:0 -1mm}
.ps td.ex{width:30%;vertical-align:middle;padding-right:1mm}
.ps td.ex b{display:block;font-size:9pt;font-weight:600;line-height:1.15}
.ps td.ex small{display:block;font-family:var(--body);font-size:6.2pt;color:#666;line-height:1.2;margin-top:.3mm}
.ps td.c{border:1px solid #aaa;border-radius:1.2mm;height:7.4mm;position:relative;font-family:var(--body);font-size:6.5pt;color:#b5b5b5;text-align:center;vertical-align:middle}
.ps td.c em{position:absolute;left:.8mm;top:.2mm;font-style:normal;font-size:5.5pt;color:#888;font-family:var(--head)}
.ps td.c.w{background:#fbf3d9}
.ps td.c.x{border-style:dashed;border-color:#ccc}
.ps td.blank b{display:block;border-bottom:1px solid #bbb;height:4.5mm;margin-right:2mm}
.ps .nl{font-family:var(--body);font-size:7pt;color:#666;margin-top:1mm;display:flex;gap:1mm;align-items:flex-end}
.ps .nl i{flex:1;border-bottom:1px solid #bbb;height:3.4mm}
.sheet .key{font-family:var(--body);font-size:6.8pt;color:#777;margin-top:2mm}
/* ---------- Skill tree ---------- */
.g{display:inline-flex;align-items:center;justify-content:center;min-width:26px;height:20px;padding:0 6px;border-radius:5px;font-family:var(--head);font-weight:700;font-size:12.5px;letter-spacing:.02em;flex:none}
.g-F{background:#59616d;color:#fff}.g-D{background:#3bb273;color:#0f2418}.g-C{background:#3f7fd9;color:#fff}.g-B{background:#8d63d9;color:#fff}
.g-A{background:#e8b931;color:#1d1600}.g-S{background:#d9463b;color:#fff}.g-SS{background:linear-gradient(135deg,#ff5fa2,#ffb347);color:#1d0a00}.g-Scalable{background:#2bb3b3;color:#062222}
.skhead{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 14px}
.skwrap{overflow:auto;background:var(--panel);border-radius:12px;padding:10px 0 20px;margin-top:4px}
.sktree{position:relative;margin:0 auto}
.sktree svg{position:absolute;inset:0;pointer-events:none}
.skrow{position:absolute;left:0;right:0;border-top:1px dashed #2f353e}
.skrow .g{position:absolute;left:14px;top:18px}
.sk{position:absolute;width:160px;height:62px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:6px 9px;text-align:left;display:flex;flex-direction:column;gap:2px;transition:border-color .15s}
.sk:hover{border-color:#5a6372}
.sk .t{display:flex;align-items:center;gap:6px}
.sk b{font-size:13px;font-weight:600;line-height:1.2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.sk small{color:var(--dim);font-size:11.5px}
.sk .pips{display:flex;gap:3px;margin-top:auto}
.sk .pips i{flex:1;height:4px;border-radius:2px;background:#3a414c}
.sk.st1 .pips i:nth-child(-n+1),.sk.st2 .pips i:nth-child(-n+2){background:var(--yellow)}
.sk.st3 .pips i{background:var(--green)}
.sk.st3{border-color:rgba(59,178,115,.6);background:#22302a}
.sk.st1,.sk.st2{border-color:rgba(232,185,49,.55)}
.sk.next{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue) inset}
.sk.far>*{opacity:.5}
.sk.ghost{border-style:dashed;background:var(--panel)}
.sklegend{display:flex;flex-wrap:wrap;gap:14px;color:var(--muted);font-size:12.5px;margin:10px 2px 0}
.sklegend span{display:inline-flex;align-items:center;gap:6px}
.sklegend i{width:14px;height:10px;border-radius:3px;border:1px solid var(--line);display:inline-block}
.skgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px;margin-bottom:8px}
.skcard{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:9px 11px;text-align:left;display:flex;align-items:center;gap:9px}
.skcard:hover{border-color:#4d5664}
.skcard .n{flex:1;min-width:0}
.skcard .n small{display:block;color:var(--dim);font-size:11.5px}
.skst{font-size:11.5px;font-weight:600;color:var(--dim);white-space:nowrap}
.skst.l1,.skst.l2{color:var(--yellow)}.skst.l3{color:var(--green)}
.skm dl{display:grid;grid-template-columns:120px 1fr;gap:5px 10px;margin:12px 0;font-size:13.5px}
.skm dt{color:var(--muted)}
.skm dd{margin:0}
.skm .opts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 4px}
.skm .lk{color:#8db7ff;cursor:pointer}
.skm .lk:hover{text-decoration:underline}
.exrow .g{margin-left:2px}
#printRoot{display:none}

@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) auto;height:100vh;height:100dvh}
  #main{order:1;padding-top:env(safe-area-inset-top)}
  #rail{order:2;flex-direction:row;padding:4px 4px calc(4px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line)}
  #rail .brand,#rail .rail-foot{display:none}
  #nav{display:flex;width:100%}
  .navb{flex:1;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:10.5px;text-align:center;width:auto;min-width:0}
  .navb svg{width:21px;height:21px}
  #restbar,#resume{left:0;bottom:calc(60px + env(safe-area-inset-bottom))}
  #restbar .in,#resume .in{padding-left:14px;padding-right:14px}
  .page{padding:18px 14px 140px}
  .toprow{flex-wrap:wrap;align-items:flex-start}
  .pgrid{grid-template-columns:1fr}
  .tgrid{grid-template-columns:1fr}
  .skm dl{grid-template-columns:100px 1fr}
  #modal{padding:4vh 10px}
  .mbox{padding:16px}
  input,select,textarea{font-size:16px}   /* (smaller text makes iPhone zoom in on tap) */
  .exh{flex-wrap:wrap;gap:2px 4px}
  .exh .exn{flex:1 0 100%;margin-bottom:2px}
  .exh .ibtn{padding:4px 7px;font-size:13px}
  .exb{padding:10px 10px 8px}
  table.sets{width:100%}
  #toast{bottom:calc(130px + env(safe-area-inset-bottom))}
}
@media print{
  @page{size:A4;margin:10mm}
  html,body{background:#fff;height:auto;overflow:visible}
  #app,#modal,#toast,#restbar,#resume{display:none!important}
  #printRoot{display:block}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const clone = o => JSON.parse(JSON.stringify(o));
const pad2 = n => String(n).padStart(2, '0');
function fmtDur(s){
  if (s == null || isNaN(s)) return '';
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60;
  return h ? `${h}:${pad2(m)}:${pad2(ss)}` : `${m}:${pad2(ss)}`;
}
// "1:30" -> 90, "1:02:00" -> 3720. A plain number is seconds, or minutes when plainIsMinutes.
function parseDur(v, plainIsMinutes){
  v = String(v).trim(); if (!v) return null;
  if (v.includes(':')){
    const p = v.split(':').map(x => parseFloat(x) || 0);
    return Math.round(p.reduce((a, x) => a * 60 + x, 0));
  }
  const n = parseFloat(v); if (isNaN(n)) return null;
  return Math.round(plainIsMinutes ? n * 60 : n);
}
const fmtNum = n => n == null ? '' : String(Math.round(n * 100) / 100);

function fmtDateLong(iso){ return new Date(iso).toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'}); }
function fmtDateShort(iso){ return new Date(iso).toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}); }
function fmtTime(iso){ return new Date(iso).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}); }
function ago(iso){
  const d = Math.floor((Date.now() - new Date(iso)) / 864e5);
  if (d <= 0) return 'today'; if (d === 1) return 'yesterday'; if (d < 7) return `${d} days ago`;
  if (d < 14) return '1 week ago'; if (d < 60) return `${Math.floor(d / 7)} weeks ago`;
  return fmtDateShort(iso);
}

  const t = $('#toast'); t.textContent = msg; t.className = 'on' + (err ? ' err' : '');

}

  if (!s._file){ const d = new Date(s.start); s._file = await uniquePath('history', `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())} ${pad2(d.getHours())}${pad2(d.getMinutes())} ${safeName(s.name)}`); }
  await writeJSON(s._file, stripMeta(s));
  const i = S.history.findIndex(x => x.id === s.id);
  if (i >= 0) S.history[i] = s; else S.history.push(s);
  S.history.sort((a, b) => new Date(b.start) - new Date(a.start));
}
async function deleteSession(s){ if (s._file) await removeFile(s._file); S.history = S.history.filter(x => x.id !== s.id); }

// skill statuses from two places, kept skill by skill: whichever was set most recently wins
function mergeSkills(a, b){
  a = a || {}; b = b || {};
  const sa = a.status || {}, sb = b.status || {}, ta = a.t || {}, tb = b.t || {}, out = { status: {}, t: {} };
  for (const id of new Set([...Object.keys(sa), ...Object.keys(sb), ...Object.keys(ta), ...Object.keys(tb)])) {
    const x = ta[id] || 0, y = tb[id] || 0;
    const from = y > x ? sb : x > y ? sa : (sa[id] != null ? sa : sb);
    if (Math.max(x, y)) out.t[id] = Math.max(x, y);
    if (from[id] != null) out.status[id] = from[id];
  }
  return out;
}

  if (host && host.skillsSet) host.skillsSet(JSON.parse(JSON.stringify(S.skills)));      // (kept even if the folder isn't open)

}

/* ---------------- history lookups ---------------- */
function lastSetsFor(exId, excludeId){
  for (const h of S.history){
    if (h.id === excludeId) continue;
    const e = h.exercises.find(x => x.exerciseId === exId);
    if (e && e.sets.length) return e.sets;
  }
  return null;
}
function lastDone(templateId){ return S.history.find(h => h.templateId === templateId); }
const e1rm = (w, r) => (!w || !r) ? 0 : r === 1 ? w : w * (1 + r / 30);
function setText(type, s){
  if (!s) return '';
  switch (type){
    case 'wr': return (s.w != null ? `${fmtKg(s.w)} kg` : '') + (s.r != null ? ` × ${s.r}` : '');
    case 'bw': return s.w ? `+${fmtKg(s.w)} kg × ${s.r ?? ''}` : (s.r != null ? `${s.r} reps` : '');
    case 'reps': return s.r != null ? `${s.r} reps` : '';
    case 'time': return fmtDur(s.t);
    case 'cardio': return [s.d != null ? `${fmtNum(s.d)} km` : '', s.t != null ? fmtDur(s.t) : ''].filter(Boolean).join(' in ');
  }
  return '';
}
function setShort(type, s){
  switch (type){
    case 'wr': return s.w != null && s.r != null ? `${fmtKg(s.w)}×${s.r}` : setText(type, s);
    case 'bw': return s.w ? `+${fmtKg(s.w)}×${s.r ?? ''}` : `${s.r ?? ''}`;
    case 'reps': return `${s.r ?? ''}`;
    default: return setText(type, s);
  }
}
// Best number to chart and compare for an exercise in one session.
function topMetric(type, sets){
  let v = 0;
  for (const s of sets){
    if (type === 'wr') v = Math.max(v, e1rm(s.w, s.r));
    else if (type === 'bw') v = Math.max(v, s.w ? e1rm(s.w, s.r) : 0) || Math.max(v, s.r || 0);
    else if (type === 'reps') v = Math.max(v, s.r || 0);
    else if (type === 'time') v = Math.max(v, s.t || 0);
    else if (type === 'cardio') v = Math.max(v, s.d || 0);
  }
  return v;
}
const metricLabel = {wr:'Estimated 1 rep max (kg)', bw:'Best set', reps:'Most reps', time:'Longest set', cardio:'Longest distance (km)'};
function findPRs(session){
  const prs = [];
  for (const e of session.exercises){
    const prior = S.history.filter(h => h.id !== session.id && new Date(h.start) < new Date(session.start))
      .flatMap(h => h.exercises.filter(x => x.exerciseId === e.exerciseId).flatMap(x => x.sets));
    if (!prior.length) continue;
    const t = e.type, now = e.sets;
    const max = (arr, f) => arr.reduce((m, s) => Math.max(m, f(s) || 0), 0);
    const checks = t === 'wr' ? [['heaviest weight', s => s.w, v => `${fmtKg(v)} kg`], ['best estimated 1RM', s => e1rm(s.w, s.r), v => `${fmtKg(Math.round(v * 10) / 10)} kg`]]
      : t === 'bw' ? [['most reps', s => s.r, v => `${v} reps`], ['most added weight', s => s.w, v => `+${fmtKg(v)} kg`]]
      : t === 'reps' ? [['most reps', s => s.r, v => `${v} reps`]]
      : t === 'time' ? [['longest set', s => s.t, fmtDur]]
      : [['longest distance', s => s.d, v => `${fmtNum(v)} km`]];
    for (const [label, f, fmt] of checks){
      const a = max(now, f), b = max(prior, f);
      if (a > 0 && a > b) prs.push({exercise: e.name, label, value: fmt(a)});
    }
  }
  return prs;
}

  if (PHONE) return `<div class="connect"><h1>Repped</h1><p class="lead">Your workouts are kept on this phone.</p>

    <p class="dim" style="font-size:12.5px;margin:10px 0 0">Works in Chrome and Edge, and in Brave once folder access is switched on. Each browser remembers its own folder, so the first open in a new browser asks you to choose it again.</p>

      <b>templates/</b> one file per workout, e.g. Cardio.json<br>
      <b>history/</b> one file per finished workout<br>
      <b>exercises.json</b>, <b>skills.json</b> and <b>settings.json</b></div>
    ${S._connectError ? `<p style="color:#ff8a80">${esc(S._connectError)}</p>` : ''}
  </div>`;
}
async function pickFolder(){
  try {
    const h = await window.showDirectoryPicker({id: 'repped', mode: 'readwrite'});
    S._connectError = '';
    await connectHandle(h);
    if (!S.templates.length && !S.history.length) await offerStarters();
    S.view = S.active ? 'editor' : 'workout';
    if (S.active) S.ed = {mode: 'active', doc: S.active};
    render(); openPending();
  } catch (e) { if (e.name !== 'AbortError'){ S._connectError = 'Could not open that folder: ' + e.message; render(); } }
}
async function reconnect(){
  const h = S.dir || S._remembered; if (!h) return pickFolder();
  try {
    if (h.requestPermission && (await h.requestPermission({mode: 'readwrite'})) !== 'granted') { toast('Permission not granted', true); return; }
    await connectHandle(h);
    S._connectError = '';
    if (S.active){ S.view = 'editor'; S.ed = {mode: 'active', doc: S.active}; }
    render(); toast('Folder connected'); openPending();
  } catch (e) { S._connectError = `Couldn't open ${h.name}. If it's on a USB stick, plug it in and try again, or choose the folder again.`; S.connected = false; render(); }
}

    ${cards ? `<div class="tgrid">${cards}</div>` : `<div class="empty">No templates yet. A template is a workout you repeat, like Upper Body or Cardio.<br><button class="btn red" data-act="tpl-new">Create a template</button></div>`}

async function openTemplate(id){
  const t = S.templates.find(x => x.id === id); if (!t) return;
  const rows = t.exercises.map(e => {
    const ex = exInfo(e.exerciseId, e), last = lastSetsFor(e.exerciseId);
    return `<tr><td>${e.sets.length} × ${esc(ex.name)}</td><td class="dim" style="text-align:right">${last ? 'Last: ' + esc(last.map(s => setShort(ex.type, s)).join(', ')) : ''}</td></tr>`;
  }).join('');
  const r = await modal(`<h2>${esc(t.name)}</h2>${t.notes ? `<p class="muted" style="margin-bottom:8px">${esc(t.notes)}</p>` : ''}
    <table style="width:100%;font-size:13.5px;border-collapse:collapse">${rows || '<tr><td class="muted">No exercises yet</td></tr>'}</table>`,
    [['Delete', 'del', 'ghost danger'], ['Duplicate', 'dup', 'ghost'], ['Edit', 'edit', ''], ['Start workout', 'start', 'red']], true);
  if (r === 'start') startWorkout(t);
  else if (r === 'edit') { S.ed = {mode: 'template', doc: clone(t)}; go('editor'); }
  else if (r === 'dup') { const c = clone(t); c.id = uid(); delete c._file; c.name = t.name + ' copy'; await saveTemplate(c); render(); toast('Template duplicated'); }
  else if (r === 'del') { if (await confirmBox(`Delete the ${t.name} template?`, 'Your past workouts stay in History.', 'Delete')){ await deleteTemplate(t); render(); toast('Template deleted'); } }
}
async function startWorkout(t){
  if (S.active){ if (!await confirmBox('A workout is already in progress', 'Discard it and start this one instead?', 'Discard and start')) return; await clearActive(); }
  S.active = sessionFromTemplate(t);
  S.active.templateStructure = t ? structureKey(t) : null;
  saveActiveSoon();
  S.ed = {mode: 'active', doc: S.active};
  go('editor');
}

// Line up last time's sets with this one: warm-ups with warm-ups, working sets with working sets.
function prevFor(e, si){
  const prev = S.ed.prevCache?.[e.exerciseId]; if (!prev) return null;
  const isW = s => (s.k || 'n') === 'w';
  const w = isW(e.sets[si]);
  const pos = e.sets.slice(0, si).filter(s => isW(s) === w).length;
  return prev.filter(s => isW(s) === w)[pos] || null;
}
function placeholderFor(e, si, f){
  const s = e.sets[si];
  if (s.target && s.target[f] != null) return s.target[f];
  const p = prevFor(e, si);
  return p && p[f] != null ? p[f] : null;
}
function fmtField(f, v, type){ return v == null ? '' : f === 't' ? fmtDur(v) : f === 'd' || f === 'w' ? fmtNum(v) : String(v); }
function exerciseBlock(e, ei, mode){
  const cols = TYPES[e.type].cols;
  if (!S.ed.prevCache) S.ed.prevCache = {};
  if (!(e.exerciseId in S.ed.prevCache)) S.ed.prevCache[e.exerciseId] = lastSetsFor(e.exerciseId, S.ed.doc.id);
  let n = 0;
  const rows = e.sets.map((s, si) => {
    const k = s.k || 'n'; const label = k === 'w' ? 'W' : k === 'd' ? 'D' : k === 'f' ? 'F' : String(++n);
    const vals = mode === 'template' ? (s.target || {}) : s;
    const p = prevFor(e, si);
    const inputs = cols.map(([f]) => {
      const ph = mode === 'template' ? '' : placeholderFor(e, si, f);
      return `<td><input class="sin" data-f="${f}" inputmode="decimal" value="${esc(fmtField(f, vals[f]))}" placeholder="${esc(ph != null ? fmtField(f, ph) : (f === 't' ? 'm:ss' : ''))}" aria-label="${f}"></td>`;
    }).join('');
    const check = mode === 'template' ? '' : `<td><button class="chk" data-act="set-done" aria-label="Mark set done">✓</button></td>`;
    return `<tr data-si="${si}" class="${s.done ? 'done' : ''}"><td><button class="kind ${k}" data-act="set-kind" title="Click to change: normal, warm-up, drop set, failure">${label}</button></td>
      <td class="prev l" data-act="set-prev" title="${p ? 'Click to copy' : ''}">${p ? esc(setText(e.type, p)) : '<span class="dim">-</span>'}</td>${inputs}${check}<td><button class="sdel" data-act="set-del" aria-label="Delete set">✕</button></td></tr>`;
  }).join('');
  const heads = cols.map(([, l]) => `<th>${l}</th>`).join('');
  const restLabel = e.rest ? fmtDur(e.rest) : 'off';
  return `<div class="exb" data-ei="${ei}">
    <div class="exh"><div class="exn" data-act="ex-detail">${esc(e.name)}<small>${esc(TYPES[e.type].label)}</small></div>
      <button class="ibtn" data-act="ex-rest" title="Rest timer after each set">Rest ${restLabel}</button>
      <button class="ibtn" data-act="ex-note">${e.notes ? 'Note' : 'Add note'}</button>
      <button class="ibtn" data-act="ex-up" aria-label="Move up">↑</button><button class="ibtn" data-act="ex-down" aria-label="Move down">↓</button>
      <button class="ibtn" data-act="ex-swap">Replace</button>
      <button class="ibtn" data-act="ex-del" aria-label="Remove exercise">✕</button></div>
    ${e.notes || e._showNote ? `<textarea class="inp exnote" data-f="exnote" rows="1" placeholder="Note for this exercise">${esc(e.notes)}</textarea>` : ''}
    <table class="sets"><thead><tr><th>Set</th><th class="l">Previous</th>${heads}${mode === 'template' ? '' : '<th>✓</th>'}<th></th></tr></thead><tbody>${rows}</tbody></table>
    <button class="addset" data-act="set-add">+ Add set</button>
  </div>`;
}
function rerenderEditor(){ const sc = $('#main').scrollTop; render(); $('#main').scrollTop = sc; }
function edChanged(){ if (S.ed?.mode === 'active') saveActiveSoon(); }
function readField(f, raw, type){
  if (raw.trim() === '') return null;
  if (f === 't') return parseDur(raw, type === 'cardio');
  if (f === 'r') { const n = parseInt(raw, 10); return isNaN(n) ? null : n; }
  const n = parseFloat(raw.replace(',', '.')); return isNaN(n) ? null : n;
}
function toggleDone(e, si, tr){
  const s = e.sets[si];
  if (s.done){ s.done = false; tr.classList.remove('done'); edChanged(); return; }
  const cols = TYPES[e.type].cols;
  for (const [f] of cols){ if (s[f] == null){ const ph = placeholderFor(e, si, f); if (ph != null) s[f] = ph; } }
  if (!cols.some(([f]) => s[f] != null)) { toast('Enter the set first'); tr.querySelector('.sin')?.focus(); return; }
  s.done = true;
  cols.forEach(([f]) => { const inp = tr.querySelector(`.sin[data-f="${f}"]`); if (inp) inp.value = fmtField(f, s[f]); });
  tr.classList.add('done');
  if (S.ed.mode === 'active' && e.rest > 0) startRest(e.rest);
  edChanged();
}
async function editorClick(btn){
  const act = btn.dataset.act, {doc, mode} = S.ed;
  const exb = btn.closest('.exb'), ei = exb ? +exb.dataset.ei : -1, e = doc.exercises[ei];
  const tr = btn.closest('tr'), si = tr ? +tr.dataset.si : -1;
  switch (act){
    case 'set-done': toggleDone(e, si, tr); break;
    case 'set-kind': { const order = ['n','w','d','f']; const s = e.sets[si]; s.k = order[(order.indexOf(s.k || 'n') + 1) % 4]; edChanged(); rerenderEditor(); break; }
    case 'set-prev': { const p = prevFor(e, si); if (!p) break; const s = e.sets[si];
      if (mode === 'template'){ s.target = {}; for (const [f] of TYPES[e.type].cols) if (p[f] != null) s.target[f] = p[f]; }
      else for (const [f] of TYPES[e.type].cols) if (p[f] != null) s[f] = p[f];
      edChanged(); rerenderEditor(); break; }
    case 'set-del': e.sets.splice(si, 1); edChanged(); rerenderEditor(); break;
    case 'set-add': { const last = e.sets[e.sets.length - 1]; const ns = {k: last && last.k !== 'w' ? last.k : 'n'};
      if (mode === 'template' && last?.target) ns.target = {...last.target};
      e.sets.push(ns); edChanged(); rerenderEditor();
      const rows = $(`.exb[data-ei="${ei}"]`).querySelectorAll('tbody tr'); rows[rows.length - 1]?.querySelector('.sin')?.focus(); break; }
    case 'ex-del': if (e.sets.some(s => s.done) && !await confirmBox(`Remove ${e.name}?`, 'Its logged sets will be removed too.', 'Remove')) break;
      doc.exercises.splice(ei, 1); edChanged(); rerenderEditor(); break;
    case 'ex-up': if (ei > 0){ [doc.exercises[ei - 1], doc.exercises[ei]] = [doc.exercises[ei], doc.exercises[ei - 1]]; edChanged(); rerenderEditor(); } break;
    case 'ex-down': if (ei < doc.exercises.length - 1){ [doc.exercises[ei + 1], doc.exercises[ei]] = [doc.exercises[ei], doc.exercises[ei + 1]]; edChanged(); rerenderEditor(); } break;
    case 'ex-note': e._showNote = true; rerenderEditor(); $(`.exb[data-ei="${ei}"] .exnote`)?.focus(); break;
    case 'ex-rest': { const v = await promptBox(`Rest after each ${e.name} set`, 'Minutes:seconds, e.g. 1:30. Use 0 to turn it off.', fmtDur(e.rest || 0));
      if (v != null){ const sec = parseDur(v); e.rest = sec || 0; edChanged(); rerenderEditor(); } break; }
    case 'ex-swap': { const picked = await pickExercises(false); if (picked?.length){ const ex = picked[0];
      if (ex.type !== e.type) e.sets.forEach(s => { delete s.w; delete s.r; delete s.t; delete s.d; delete s.target; s.done = false; });
      Object.assign(e, {exerciseId: ex.id, name: ex.name, type: ex.type}); edChanged(); rerenderEditor(); } break; }
    case 'ex-detail': if (mode === 'active') go('exercise', e.exerciseId); break;
    case 'ex-add': { const picked = await pickExercises(true); if (picked?.length){ for (const ex of picked) doc.exercises.push(newExerciseEntry(ex)); edChanged(); rerenderEditor();
      $('#main').scrollTop = $('#main').scrollHeight; } break; }
    case 'finish': finishWorkout(); break;
    case 'discard': if (await confirmBox('Discard this workout?', 'Nothing from it will be saved.', 'Discard')){ await clearActive(); S.ed = null; go('workout'); toast('Workout discarded'); } break;
    case 'tpl-save': saveTemplateFromEditor(); break;
    case 'past-save': savePastFromEditor(); break;
    case 'ed-cancel': S.ed = null; go(mode === 'past' ? 'history' : 'workout'); break;
  }
}
function editorInput(el){
  const {doc, mode} = S.ed;
  if (el.id === 'wname'){ doc.name = el.value; edChanged(); return; }
  if (el.id === 'wnotes'){ doc.notes = el.value; edChanged(); return; }
  const exb = el.closest('.exb'); if (!exb) return;
  const e = doc.exercises[+exb.dataset.ei];
  if (el.dataset.f === 'exnote'){ e.notes = el.value; edChanged(); return; }
  const tr = el.closest('tr'); if (!tr) return;
  const s = e.sets[+tr.dataset.si], f = el.dataset.f, v = readField(f, el.value, e.type);
  if (mode === 'template'){ s.target = s.target || {}; if (v == null) delete s.target[f]; else s.target[f] = v; if (!Object.keys(s.target).length) delete s.target; }
  else { if (v == null) delete s[f]; else s[f] = v; }
  edChanged();
}
function editorKey(ev){
  const el = ev.target;
  if (ev.key !== 'Enter' || !el.classList.contains('sin')) return;
  ev.preventDefault();
  const tr = el.closest('tr'), ins = [...tr.querySelectorAll('.sin')], i = ins.indexOf(el);
  if (i < ins.length - 1) { ins[i + 1].focus(); ins[i + 1].select(); return; }
  if (S.ed.mode !== 'template'){ const e = S.ed.doc.exercises[+el.closest('.exb').dataset.ei]; const si = +tr.dataset.si; if (!e.sets[si].done) toggleDone(e, si, tr); }
  let next = tr.nextElementSibling;
  if (!next){ const nb = el.closest('.exb').nextElementSibling; next = nb?.classList.contains('exb') ? nb.querySelector('tbody tr') : null; }
  const ni = next?.querySelector('.sin'); if (ni){ ni.focus(); ni.select(); }
}

async function finishWorkout(){
  const doc = S.active;
  const unticked = doc.exercises.reduce((n, e) => n + e.sets.filter(s => !s.done && TYPES[e.type].cols.some(([f]) => s[f] != null)).length, 0);
  let countUnticked = false;
  if (unticked){
    const r = await modal(`<h2>${unticked} set${unticked > 1 ? 's' : ''} not ticked</h2><p class="muted">Some sets have numbers in them but weren't ticked off.</p>`,
      [['Keep editing', null, 'ghost'], ['Leave them out', 'drop', ''], ['Count them', 'count', 'green']]);
    if (!r) return; countUnticked = r === 'count';
  }
  const out = clone(doc);
  out.exercises = out.exercises.map(e => ({exerciseId: e.exerciseId, name: e.name, type: e.type, rest: e.rest, notes: e.notes || '',
    sets: e.sets.filter(s => s.done || (countUnticked && TYPES[e.type].cols.some(([f]) => s[f] != null)))
      .map(s => { const o = {k: s.k || 'n'}; for (const f of ['w','r','t','d']) if (s[f] != null) o[f] = s[f]; return o; })}))
    .filter(e => e.sets.length);
  if (!out.exercises.length){ toast('Tick off at least one set before finishing'); return; }
  out.end = new Date().toISOString();
  out.durationSec = Math.round((new Date(out.end) - new Date(out.start)) / 1000);
  delete out.templateStructure;
  // Offer to update the template if the shape changed
  const t = S.templates.find(x => x.id === doc.templateId);
  let updateTpl = false;
  if (t && structureKey(doc) !== structureKey(t)){
    updateTpl = await modal(`<h2>Update the ${esc(t.name)} template?</h2><p class="muted">You changed the exercises or sets. Save this layout as the new template?</p>`,
      [['Keep template as it was', false, 'ghost'], ['Update template', true, 'red']]);
  }
  try { await saveSession(out); } catch (e) { return; }
  if (updateTpl){
    const nt = clone(t);
    nt.exercises = doc.exercises.map(e => { const old = t.exercises.find(x => x.exerciseId === e.exerciseId);
      return {exerciseId: e.exerciseId, name: e.name, type: e.type, rest: e.rest, notes: e.notes || '', sets: e.sets.map((s, i) => ({k: s.k || 'n', target: old?.sets[i]?.target}))}; });
    nt._file = t._file; await saveTemplate(nt);
  }
  await clearActive(); S.ed = null;
  const prs = findPRs(out), vol = volume(out), sets = out.exercises.reduce((n, e) => n + e.sets.length, 0);
  go('history');
  await modal(`<h2>Workout saved</h2><p class="muted">${esc(out.name)}, ${fmtDateLong(out.start)}</p>
    <div class="stats" style="margin:14px 0 6px"><div class="stat"><b class="num">${fmtDur(out.durationSec)}</b><span>Time</span></div><div class="stat"><b class="num">${sets}</b><span>Sets</span></div>${vol ? `<div class="stat"><b class="num">${Math.round(vol).toLocaleString('en-GB')} kg</b><span>Volume</span></div>` : ''}</div>
    ${prs.length ? `<h3 style="margin-top:10px;color:var(--yellow)">New personal records</h3><ul style="margin:6px 0 0;padding-left:18px">${prs.map(p => `<li><b>${esc(p.exercise)}</b>: ${esc(p.label)}, ${esc(p.value)}</li>`).join('')}</ul>` : ''}`,
    [['Done', true, 'red']]);
}
function volume(s){ return s.exercises.reduce((v, e) => v + (e.type === 'wr' || e.type === 'bw' ? e.sets.reduce((a, x) => a + (x.w || 0) * (x.r || 0), 0) : 0), 0); }
async function saveTemplateFromEditor(){
  const d = S.ed.doc; d.name = (d.name || '').trim();
  if (!d.name){ toast('Give the template a name'); $('#wname').focus(); return; }
  const t = {id: d.id || uid(), kind: 'template', name: d.name, notes: d.notes || '', order: d.order, _file: d._file,
    exercises: d.exercises.map(e => ({exerciseId: e.exerciseId, name: e.name, type: e.type, rest: e.rest ?? S.settings.defaultRest, notes: e.notes || '',
      sets: e.sets.map(s => { const o = {k: s.k || 'n'}; if (s.target && Object.keys(s.target).length) o.target = s.target; return o; })}))};
  if (t.order == null) t.order = S.templates.length + 1;
  try { await saveTemplate(t); } catch (e) { return; }
  S.ed = null; go('workout'); toast('Template saved');
}
async function savePastFromEditor(){
  const d = S.ed.doc;
  const date = $('#pdate').value, time = $('#ptime').value || '12:00', mins = parseFloat($('#pdur').value) || 60;
  if (!date){ toast('Pick a date'); return; }
  const start = new Date(`${date}T${time}`);
  const out = {id: d.id || uid(), kind: 'session', name: (d.name || 'Workout').trim(), templateId: d.templateId || null, notes: d.notes || '', _file: d._file,
    start: start.toISOString(), end: new Date(+start + mins * 60000).toISOString(), durationSec: Math.round(mins * 60), logged: d.logged || 'manual',
    exercises: d.exercises.map(e => ({exerciseId: e.exerciseId, name: e.name, type: e.type, rest: e.rest, notes: e.notes || '',
      sets: e.sets.filter(s => s.done || TYPES[e.type].cols.some(([f]) => s[f] != null)).map(s => { const o = {k: s.k || 'n'}; for (const f of ['w','r','t','d']) if (s[f] != null) o[f] = s[f]; return o; })}))
      .filter(e => e.sets.length)};
  if (!out.exercises.length){ toast('Fill in at least one set'); return; }
  // If the date changed on an existing file, write a new file name for it
  if (out._file){ const old = S.history.find(h => h.id === out.id); if (old && old.start !== out.start){ await removeFile(out._file); delete out._file; } }
  try { await saveSession(out); } catch (e) { return; }
  S.ed = null; go('history'); toast('Workout saved');
}

/* ---------- exercise picker ---------- */
function pickExercises(multi){
  return new Promise(resolve => {
    const sel = new Set(); let cat = 'All', q = '';
    const draw = () => {
      const list = allEx().filter(e => (cat === 'All' || e.cat === cat) && e.name.toLowerCase().includes(q.toLowerCase()));
      $('#plist').innerHTML = list.map(e => `<label class="${sel.has(e.id) ? 'sel' : ''}"><input type="${multi ? 'checkbox' : 'radio'}" name="pk" value="${esc(e.id)}" ${sel.has(e.id) ? 'checked' : ''}>${esc(e.name)}<small>${esc(e.cat)}</small></label>`).join('') || '<p class="muted" style="padding:8px">No match. Create it with New exercise.</p>';
      $('#pchips').innerHTML = ['All', ...CATS].map(c => `<button class="chip ${c === cat ? 'on' : ''}" data-c="${c}">${c}</button>`).join('');
      $('#padd').textContent = multi ? `Add ${sel.size || ''}`.trim() : 'Choose';
      $('#padd').disabled = !sel.size;
    };
    const m = $('#modal');
    m.innerHTML = `<div class="mbox wide"><h2>${multi ? 'Add exercises' : 'Replace exercise'}</h2>
      <div class="row"><input class="inp grow" id="psearch" placeholder="Search exercises" autocomplete="off"><button class="btn" id="pnew">New exercise</button></div>
      <div class="chips" id="pchips" style="margin:10px 0 0"></div><div class="plist" id="plist"></div>
      <div class="mfoot"><button class="btn ghost" id="pcancel">Cancel</button><button class="btn red" id="padd">Add</button></div></div>`;
    m.classList.add('on');
    const close = v => { m.classList.remove('on'); m.innerHTML = ''; resolve(v); };
    $('#psearch').oninput = ev => { q = ev.target.value; draw(); };
    $('#pchips').onclick = ev => { const c = ev.target.closest('.chip'); if (c){ cat = c.dataset.c; draw(); } };
    $('#plist').onchange = ev => { const id = ev.target.value; if (!multi) sel.clear(); if (ev.target.checked) sel.add(id); else sel.delete(id);
      $('#plist').querySelectorAll('label').forEach(l => l.classList.toggle('sel', sel.has(l.querySelector('input').value)));
      $('#padd').textContent = multi ? `Add ${sel.size || ''}`.trim() : 'Choose'; $('#padd').disabled = !sel.size; };
    $('#plist').ondblclick = ev => { const l = ev.target.closest('label'); if (l){ const id = l.querySelector('input').value; sel.add(id); close([...sel].map(i => EXI.get(i))); } };
    $('#pcancel').onclick = () => close(null);
    $('#padd').onclick = () => close([...sel].map(i => EXI.get(i)));
    $('#pnew').onclick = async () => { m.classList.remove('on');
      const ex = await editExerciseModal(null, q); if (ex){ close([ex]); } else { pickExercises(multi).then(resolve); } };
    m.onclick = ev => { if (ev.target === m) close(null); };
    draw(); $('#psearch').focus();
  });
}
async function editExerciseModal(ex, presetName){
  const isNew = !ex; ex = ex ? {...ex} : {id: 'c:' + uid(), name: presetName || '', cat: 'Other', type: 'wr'};
  const r = await modal(`<h2>${isNew ? 'New exercise' : 'Edit exercise'}</h2>
    <div class="field"><label for="xn">Name</label><input class="inp" id="xn" value="${esc(ex.name)}"></div>
    <div class="row"><div class="field grow"><label for="xc">Body part</label><select class="inp" id="xc">${CATS.map(c => `<option ${c === ex.cat ? 'selected' : ''}>${c}</option>`).join('')}</select></div>
    <div class="field grow"><label for="xt">What you log</label><select class="inp" id="xt" ${isNew || !exUsed(ex.id) ? '' : 'disabled'}>${Object.entries(TYPES).map(([k, v]) => `<option value="${k}" ${k === ex.type ? 'selected' : ''}>${v.label}</option>`).join('')}</select></div></div>`,
    [['Cancel', null, 'ghost'], [isNew ? 'Create exercise' : 'Save', 'ok', 'red']], false, () => { const n = $('#xn').value.trim(); if (!n){ toast('Give it a name'); return false; }
      ex.name = n; ex.cat = $('#xc').value; ex.type = $('#xt').value; return true; }, '#xn');
  if (r !== 'ok') return null;
  const i = S.custom.findIndex(c => c.id === ex.id);
  if (i >= 0) S.custom[i] = ex; else S.custom.push(ex);
  await saveCustom(); toast(isNew ? 'Exercise created' : 'Exercise saved');
  return EXI.get(ex.id);
}
const exUsed = id => S.history.some(h => h.exercises.some(e => e.exerciseId === id)) || S.templates.some(t => t.exercises.some(e => e.exerciseId === id));

/* ---------- history ---------- */
function historyView(){
  let html = `<div class="page"><div class="toprow"><div><h1>History</h1><p class="sub">${S.history.length} workout${S.history.length === 1 ? '' : 's'} logged</p></div>
    <button class="btn" data-act="log-past">Log a past workout</button></div>`;
  if (!S.history.length) return html + `<div class="empty">Finished workouts appear here. Back from a trip with paper sheets? Use Log a past workout to type them in.</div></div>`;
  let month = '';
  for (const h of S.history){
    const m = new Date(h.start).toLocaleDateString('en-GB', {month: 'long', year: 'numeric'});
    if (m !== month){ month = m; html += `<h3 class="month">${m}</h3>`; }
    const vol = volume(h);
    const prCount = findPRs(h).length;
    const rows = h.exercises.map(e => { const best = bestSet(e); return `<tr><td>${e.sets.length} × ${esc(e.name)}</td><td>${best ? esc(setText(e.type, best)) : ''}</td></tr>`; }).join('');
    html += `<div class="hcard" role="button" tabindex="0" data-act="hist-open" data-id="${h.id}"><div class="top"><h3>${esc(h.name)}</h3>${prCount ? `<span class="pr">${prCount} PR${prCount > 1 ? 's' : ''}</span>` : ''}</div>
      <div class="meta"><span>${fmtDateLong(h.start)}${h.logged ? '' : ', ' + fmtTime(h.start)}</span><span class="num">${fmtDur(h.durationSec)}</span>${vol ? `<span class="num">${Math.round(vol).toLocaleString('en-GB')} kg</span>` : ''}${h.logged ? '<span>Logged later</span>' : ''}</div>
      <table>${rows}</table></div>`;
  }
  return html + '</div>';
}
function bestSet(e){
  let best = null, bv = -1;
  for (const s of e.sets){ const v = topMetric(e.type, [s]) || (s.r || 0); if (v > bv){ bv = v; best = s; } }
  return best;
}
async function openSession(id){
  const h = S.history.find(x => x.id === id); if (!h) return;
  const body = h.exercises.map(e => {
    let n = 0;
    return `<h3 style="margin:14px 0 4px">${esc(e.name)}</h3>${e.notes ? `<p class="muted" style="font-size:13px">${esc(e.notes)}</p>` : ''}<table style="font-size:13.5px">${e.sets.map(s => `<tr><td style="width:34px;color:var(--dim);font-family:var(--head)">${s.k === 'w' ? 'W' : s.k === 'd' ? 'D' : s.k === 'f' ? 'F' : ++n}</td><td class="num">${esc(setText(e.type, s))}</td></tr>`).join('')}</table>`;
  }).join('');
  const r = await modal(`<h2>${esc(h.name)}</h2><p class="muted">${fmtDateLong(h.start)}${h.logged ? '' : ', ' + fmtTime(h.start)}, ${fmtDur(h.durationSec)}</p>${h.notes ? `<p style="margin-top:8px">${esc(h.notes)}</p>` : ''}${body}`,
    [['Delete', 'del', 'ghost danger'], ['Save as template', 'tpl', 'ghost'], ['Edit', 'edit', ''], ['Close', null, 'red']], true);

function chartSVG(pts, type){
  const W = 640, H = 180, P = {l: 44, r: 12, t: 10, b: 24};
  const vs = pts.map(p => p.v), lo = Math.min(...vs), hi = Math.max(...vs), span = hi - lo || hi || 1;
  const y0 = Math.max(0, lo - span * .15), y1 = hi + span * .15;
  const t0 = +pts[0].t, t1 = +pts[pts.length - 1].t || t0 + 1;
  const X = t => P.l + (W - P.l - P.r) * ((+t - t0) / ((t1 - t0) || 1)), Y = v => P.t + (H - P.t - P.b) * (1 - (v - y0) / ((y1 - y0) || 1));
  const fmt = v => type === 'time' ? fmtDur(v) : fmtNum(Math.round(v * 10) / 10);
  const ticks = [y0, (y0 + y1) / 2, y1];
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${X(p.t).toFixed(1)},${Y(p.v).toFixed(1)}`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" role="img" aria-label="Progress chart">
    ${ticks.map(v => `<line x1="${P.l}" x2="${W - P.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="#353c46"/><text x="${P.l - 6}" y="${Y(v) + 4}" fill="#6b7380" font-size="11" text-anchor="end">${fmt(v)}</text>`).join('')}
    <text x="${P.l}" y="${H - 6}" fill="#6b7380" font-size="11">${fmtDateShort(pts[0].t)}</text><text x="${W - P.r}" y="${H - 6}" fill="#6b7380" font-size="11" text-anchor="end">${fmtDateShort(pts[pts.length - 1].t)}</text>
    <path d="${line}" fill="none" stroke="#3f7fd9" stroke-width="2.2" vector-effect="non-scaling-stroke"/>
    ${pts.map(p => `<circle cx="${X(p.t)}" cy="${Y(p.v)}" r="3.2" fill="#ecebe6"/>`).join('')}</svg>`;
}

/* ---------- skill tree ---------- */
const GI = g => GRADES.indexOf(g);
// your best set of each skill's exercise, from History (and the workout in progress)
function skillBests(){
  const best = new Map();
  const add = (exId, s) => { if (!s) return; const b = best.get(exId) || {r: 0, t: 0}; b.r = Math.max(b.r, s.r || 0); b.t = Math.max(b.t, s.t || 0); best.set(exId, b); };
  for (const h of S.history) for (const e of h.exercises) for (const s of e.sets) add(e.exerciseId, s);
  if (S.active) for (const e of S.active.exercises) for (const s of e.sets) if (s.done) add(e.exerciseId, s);
  return best;
}
/* What a skill needs to be unlocked, in progress and mastered. It goes by grade (an easy skill needs many reps

const TARGET_REPS = {F: [5, 10, 20], D: [3, 8, 15], C: [2, 5, 10], B: [1, 3, 8], A: [1, 3, 6], S: [1, 2, 4], SS: [1, 2, 3], Scalable: [1, 3, 6]};

const TARGET_OWN = {
  'Deadhang': [20, 40, 60], 'Active Hang': [10, 20, 40], 'Wall Sit': [30, 60, 120], 'Plank': [30, 60, 120], 'Side Plank': [20, 40, 60],
  'Hollow Body Hold': [15, 30, 60], 'Assisted Handstand': [15, 30, 60], 'Handstand': [5, 15, 30], 'L-sit': [5, 10, 20], 'Crow Pose': [5, 15, 30],
  'Frog Stand': [5, 15, 30], 'Ring Support Hold': [10, 20, 30], 'Elbow Lever': [5, 10, 20], 'German Hang': [10, 20, 30], 'Planche Lean': [5, 15, 30],
  'Tuck FL': [3, 8, 15], 'Bodyweight Squat': [10, 20, 30], 'Push-up': [5, 15, 30], 'Assisted Push-up': [5, 10, 20], 'Inverted Row': [5, 10, 20],
  'Pull-up': [1, 5, 10], 'Chin-up': [1, 5, 10], 'Sit-up': [10, 20, 30], 'Glute Bridge': [10, 20, 30], 'Split Squat': [5, 10, 20], 'Dip': [3, 8, 15],
  'Pistol Squat': [1, 3, 5], 'Muscle-Up': [1, 3, 5], 'HSPU': [1, 3, 5], 'Nordic Curl': [1, 3, 5],
};
const skillHold = sk => exInfo(sk.ex).type === 'time';
const targetsOf = sk => TARGET_OWN[sk.name] || (skillHold(sk) ? TARGET_SECS : TARGET_REPS)[sk.grade] || [1, 3, 6];
const targetText = (sk, n) => skillHold(sk) ? n + ' s' : n + ' rep' + (n === 1 ? '' : 's');
function autoLevel(sk, bests){
  const b = bests.get(sk.ex); if (!b) return 0;
  const v = skillHold(sk) ? b.t : b.r, [u, p, m] = targetsOf(sk);
  return v >= m ? 3 : v >= p ? 2 : v >= u ? 1 : 0;
}
function skillState(bests){
  bests = bests || skillBests();
  const st = new Map();
  for (const sk of SKILLS){
    const manual = S.skills.status[sk.id], auto = autoLevel(sk, bests);
    st.set(sk.id, {auto, manual, level: manual != null ? manual : auto});
  }
  // a mastered skill means everything before it is mastered too
  const up = id => { for (const r of SKBY.get(id).req){ const y = st.get(r); if (y.level < 3 && y.manual == null){ y.level = 3; y.implied = true; } up(r); } };
  for (const sk of SKILLS) if (st.get(sk.id).level === 3 && !st.get(sk.id).implied) up(sk.id);
  for (const sk of SKILLS){ const x = st.get(sk.id); x.ready = sk.req.every(r => st.get(r).level >= 3); x.next = x.level === 0 && x.ready; }
  return st;
}
const bestText = (sk, bests) => { const b = bests.get(sk.ex); if (!b) return ''; return exInfo(sk.ex).type === 'time' ? (b.t ? fmtDur(b.t) + ' hold' : '') : (b.r ? b.r + ' rep' + (b.r > 1 ? 's' : '') : ''); };
const gradeLabel = g => g === 'Scalable' ? '∞' : g;

function layoutBranch(branch){
  const own = SKILLS.filter(sk => sk.branch === branch), ids = new Set(own.map(sk => sk.id));
  const ghosts = [...new Set(own.flatMap(sk => sk.req).filter(r => !ids.has(r)))].map(r => SKBY.get(r));
  const nodes = [...own, ...ghosts], inSet = new Set(nodes.map(n => n.id));
  const sub = new Map();
  const L = n => { if (sub.has(n.id)) return sub.get(n.id); sub.set(n.id, 0);
    let v = 0; if (ids.has(n.id)) for (const r of n.req) if (inSet.has(r)){ const p = SKBY.get(r); if (GI(p.grade) === GI(n.grade)) v = Math.max(v, L(p) + 1); }
    sub.set(n.id, v); return v; };
  nodes.forEach(L);
  const key = n => GI(n.grade) * 10 + sub.get(n.id);
  const keys = [...new Set(nodes.map(key))].sort((a, b) => a - b);
  const rows = keys.map(k => nodes.filter(n => key(n) === k));
  const COL = 180, ROW = 92, LEFT = 70, maxN = Math.max(...rows.map(r => r.length));
  const pos = new Map();
  rows.forEach((row, ri) => {
    const order = nodes.indexOf.bind(nodes);
    const bary = n => { const xs = n.req.filter(r => pos.has(r)).map(r => pos.get(r).x); return xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 1e6 + order(n); };
    row.sort((a, b) => bary(a) - bary(b));
    row.forEach((n, i) => pos.set(n.id, {x: LEFT + (maxN - row.length) * COL / 2 + i * COL, y: 14 + ri * ROW}));
  });
  return {nodes, ghosts: new Set(ghosts.map(g => g.id)), pos, rows, keys, width: LEFT + maxN * COL + 10, height: 14 + rows.length * ROW};

      <dt>Targets</dt><dd>${(([u, p, m]) => `${targetText(sk, u)} unlocks, ${targetText(sk, p)} is in progress, ${targetText(sk, m)} or more is mastered`)(targetsOf(sk))}</dd></dl>
      <p class="muted" style="font-size:12.5px">Status${x.manual != null ? ' (set by you)' : x.implied ? ' (mastered, because a skill after it is mastered)' : ` (from your workouts: ${SKLEVELS[x.auto]})`}</p>
      <div class="opts"><button class="chip ${x.manual == null ? 'on' : ''}" data-sst="auto">From workouts</button>${SKLEVELS.map((l, i) => `<button class="chip ${x.manual === i ? 'on' : ''}" data-sst="${i}">${l}</button>`).join('')}</div></div>`; };
  const p = modal(`<div id="skbody">${draw()}</div>`, [['Close', null, 'ghost'], ['Add to a workout', 'add', ''], ['Exercise history', 'ex', 'red']], true);
  const m = $('#modal');
  const ctl = new AbortController();
  m.addEventListener('click', async ev => {
    const o = ev.target.closest('[data-sst]');
    if (o){ const v = o.dataset.sst; if (v === 'auto') delete S.skills.status[sk.id]; else S.skills.status[sk.id] = +v; (S.skills.t = S.skills.t || {})[sk.id] = Date.now();
      $('#skbody').innerHTML = draw(); try { await saveSkills(); } catch (e) {} if (S.view === 'skills' || S.view === 'exercise') render(); return; }
    const l = ev.target.closest('[data-sk]'); if (l){ m.querySelector('.mfoot .btn').click(); setTimeout(() => openSkill(l.dataset.sk), 0); return; }
    const e = ev.target.closest('[data-ex]'); if (e){ m.querySelector('.mfoot .btn').click(); setTimeout(() => go('exercise', e.dataset.ex), 0); }
  }, { signal: ctl.signal });
  const r = await p;
  ctl.abort();
  if (r === 'ex') go('exercise', sk.ex);
  else if (r === 'add') addSkillToWorkout(sk);
}
function skillEntry(sk, sets){
  const ex = exInfo(sk.ex);
  return {uid: uid(), exerciseId: ex.id, name: ex.name, type: ex.type, rest: 120, notes: '', sets: Array.from({length: sets || 3}, () => ({k: 'n', target: ex.type === 'time' ? {t: targetsOf(sk)[2]} : undefined}))};
}
function addSkillToWorkout(sk){
  if (S.active){ S.active.exercises.push(skillEntry(sk)); saveActiveSoon(); S.ed = {mode: 'active', doc: S.active}; go('editor'); toast(`${sk.name} added to your workout`); return; }
  startWorkout({id: null, name: sk.name + ' practice', notes: '', exercises: [skillEntry(sk)]});
}
function buildSkillsWorkout(){
  const st = skillState(), lv = sk => st.get(sk.id).level;
  const working = SKILLS.filter(sk => lv(sk) === 1 || lv(sk) === 2).sort((a, b) => GI(b.grade) - GI(a.grade));
  const next = SKILLS.filter(sk => st.get(sk.id).next).sort((a, b) => GI(a.grade) - GI(b.grade));
  const pick = [], per = {};
  for (const sk of [...working, ...next]){ if (pick.length >= 8 || (per[sk.branch] || 0) >= 2 || pick.some(p => p.ex === sk.ex)) continue; pick.push(sk); per[sk.branch] = (per[sk.branch] || 0) + 1; }
  if (!pick.length){ toast('Nothing to practise yet. Set a status on a skill first.'); return; }
  const doc = {id: uid(), name: 'Skill practice', notes: 'Built from the skill tree: ' + pick.map(sk => sk.name).join(', '), exercises: pick.map(sk => skillEntry(sk))};
  S.ed = {mode: 'template', doc}; go('editor');
  toast('Check it over, then save it as a template');
}

/* ---------- settings ---------- */
function settingsView(){
  return `<div class="page"><div class="toprow"><div><h1>Settings</h1></div></div>
    ${PHONE ? `<div class="pbox" style="max-width:560px"><h3>Kept on this phone</h3><p class="muted">${S.templates.length} templates, ${S.history.length} workouts. Open Repped from its home screen icon so iOS keeps them safe, and export a backup now and then.</p></div>`
    : `<div class="pbox" style="max-width:560px"><h3>Workouts folder</h3><p class="muted" style="margin-bottom:12px"><span class="dot ${S.connected ? '' : 'off'}" style="display:inline-block;margin-right:6px"></span>${esc(S.dirName)}: ${S.templates.length} templates, ${S.history.length} workouts</p>
      <div class="row"><button class="btn" data-act="pick">Choose a different folder</button>${S.connected ? '' : '<button class="btn red" data-act="reconnect">Reconnect</button>'}</div>
      <p class="dim" style="font-size:12.5px;margin-top:10px">Chrome or Edge can't remember folder access between visits, so you may be asked to allow it each time you open Repped.</p></div>`}
    <div class="pbox" style="max-width:560px"><h3>Backup</h3><p class="muted" style="margin-bottom:12px">One file with every template, finished workout, your skill tree and settings. Export it on one device and import it on the other to move your progress (for example from your computer to your phone).</p>
      <div class="row"><button class="btn" data-act="bk-export">Export backup</button><button class="btn" data-act="bk-import">Import backup</button></div>
      <input type="file" id="bk-file" accept=".json,application/json" hidden></div>
    <div class="pbox" style="max-width:560px"><h3>Workouts</h3>
      <div class="field"><label for="srest">Default rest for new exercises (m:ss)</label><input class="inp" id="srest" value="${fmtDur(S.settings.defaultRest)}" style="width:120px"></div>
      <label class="chkline"><input type="checkbox" id="ssound" ${S.settings.sound ? 'checked' : ''}> Beep when rest is over</label></div>
    <div class="pbox" style="max-width:560px"><h3>Starter templates</h3><p class="muted" style="margin-bottom:10px">Upper, Lower, Cardio and Mobility. Only ones you don't already have are added.</p>
      <button class="btn" data-act="starters-add" ${missingStarters().length ? '' : 'disabled'}>${missingStarters().length ? 'Add ' + andList(missingStarters().map(t => esc(t.name))) : 'All added'}</button></div></div>`;
}

/* ---------- print planner ---------- */
function printView(){
  const P = S.print;
  const adds = S.templates.map(t => `<button class="btn" data-act="pr-add" data-id="${t.id}">+ ${esc(t.name)}</button>`).join('');
  const series = P.series.map((id, i) => { const t = S.templates.find(x => x.id === id); return t ? `<li><span class="k num">${i + 1}</span><span class="n">${esc(t.name)}</span>
    <button class="ibtn" data-act="pr-up" data-i="${i}" aria-label="Move up">↑</button><button class="ibtn" data-act="pr-down" data-i="${i}" aria-label="Move down">↓</button><button class="ibtn" data-act="pr-del" data-i="${i}" aria-label="Remove">✕</button></li>` : ''; }).join('');
  const total = P.series.length * (P.repeat || 1);
  return `<div class="page wide"><div class="toprow"><div><h1>Print sheets</h1><p class="sub">Build a run of workouts, then save it as a compact PDF to fill in with a pen.</p></div></div>
    <div class="pgrid"><div class="pside">
      <div class="pbox"><h3>Workouts in order</h3>${adds ? `<div class="addlist">${adds}</div>` : '<p class="muted">Create a template first.</p>'}
        ${series ? `<ul class="series" style="margin-top:12px">${series}</ul>` : '<p class="dim" style="margin-top:10px;font-size:13px">Add workouts in the order you plan to do them.</p>'}
        ${P.series.length ? `<div class="chkline" style="margin-top:12px">Rounds of this list <input class="inp" type="number" min="1" max="20" id="prep" value="${P.repeat}"></div><button class="btn ghost" data-act="pr-clear" style="margin-left:-10px">Clear list</button>` : ''}</div>
      <div class="pbox"><h3>Sheet options</h3>
        <div class="field"><label for="ptitle">Title on the sheet</label><input class="inp" id="ptitle" value="${esc(P.title)}" placeholder="e.g. Camping, half term"></div>
        <label class="chkline"><input type="checkbox" id="plast" ${P.last ? 'checked' : ''}> Show last time's numbers</label>
        <label class="chkline"><input type="checkbox" id="pnum" ${P.number ? 'checked' : ''}> Number the workouts</label>
        <label class="chkline">Spare set boxes per exercise <input class="inp" type="number" min="0" max="3" id="pxs" value="${P.extraSets}"></label>
        <label class="chkline">Blank exercise lines per workout <input class="inp" type="number" min="0" max="4" id="pxe" value="${P.extraEx}"></label></div>
      <button class="btn red big" data-act="pr-print" style="width:100%" ${total ? '' : 'disabled'}>Save as PDF</button>
      <p class="dim" style="font-size:12.5px;margin-top:8px">In the print window choose Save as PDF as the destination, A4 paper. When you're back, type the sheets in with History, Log a past workout.</p>
    </div>
    <div class="paperwrap" id="paperwrap"></div></div></div>`;
}
function sheetHTML(){
  const P = S.print, list = [];
  for (let r = 0; r < (P.repeat || 1); r++) for (const id of P.series){ const t = S.templates.find(x => x.id === id); if (t) list.push(t); }
  if (!list.length) return '';
  const cards = list.map((t, i) => {
    const maxSets = Math.max(1, ...t.exercises.map(e => e.sets.length)) + (P.extraSets || 0);
    const cols = Math.min(maxSets, 8);
    const rows = t.exercises.map(e => {
      const ex = exInfo(e.exerciseId, e), type = ex.type;
      const last = P.last ? lastSetsFor(e.exerciseId) : null;
      const tgt = e.sets.filter(s => s.target).map(s => setShort(type, s.target));
      const unweighted = last && (type === 'reps' || (type === 'bw' && !last.some(s => s.w)));
      const hint = [last ? 'Last ' + last.map(s => setShort(type, s)).join(', ') + (unweighted ? ' reps' : '') : '', !last && tgt.length ? 'Target ' + tgt.join(', ') : '', e.rest ? 'Rest ' + fmtDur(e.rest) : ''].filter(Boolean).join('; ');
      const mid = type === 'wr' ? 'kg × reps' : type === 'bw' ? '+kg × reps' : type === 'reps' ? 'reps' : type === 'time' ? (e.sets[0]?.target?.t ? fmtDur(e.sets[0].target.t) : 'time') : 'km / time';
      let n = 0, cells = '';
      for (let c = 0; c < cols; c++){
        const s = e.sets[c];
        if (s){ const k = s.k || 'n'; const lab = k === 'w' ? 'W' : k === 'd' ? 'D' : k === 'f' ? 'F' : ++n;
          const tt = type === 'time' && s.target?.t ? fmtDur(s.target.t) : type === 'cardio' && s.target?.t ? fmtDur(s.target.t) : mid;
          cells += `<td class="c ${k === 'w' ? 'w' : ''}"><em>${lab}</em>${tt}</td>`; }
        else if (c < e.sets.length + (P.extraSets || 0)) cells += `<td class="c x"><em>${++n}</em></td>`;
        else cells += '<td></td>';
      }
      return `<tr><td class="ex"><b>${esc(ex.name)}</b>${hint ? `<small>${esc(hint)}</small>` : ''}</td>${cells}</tr>`;
    }).join('');
    let blanks = '';
    for (let b = 0; b < (P.extraEx || 0); b++){ let cells = ''; for (let c = 0; c < cols; c++) cells += c < Math.min(cols, 4) ? `<td class="c x"><em>${c + 1}</em></td>` : '<td></td>'; blanks += `<tr><td class="ex blank"><b></b></td>${cells}</tr>`; }
    return `<section class="ps"><header><b>${esc(t.name)}</b>${P.number ? `<span class="no">#${i + 1}</span>` : ''}<span class="ln">Date <i></i></span><span class="ln">Start <i class="s"></i></span><span class="ln">End <i class="s"></i></span></header>
      <table><colgroup><col style="width:30%">${'<col>'.repeat(cols)}</colgroup>${rows}${blanks}</table><div class="nl">Notes <i></i></div></section>`;
  }).join('');
  const title = P.title.trim() || 'Workout log';
  return `<div class="sheet"><div class="stitle"><b>${esc(title)}</b><span>${list.length} workout${list.length > 1 ? 's' : ''}, printed ${fmtDateShort(new Date().toISOString())}</span></div>${cards}
    <p class="key">W = warm-up set (shaded), D = drop set, F = to failure. Dashed boxes are spare. Log these later in Repped: History, Log a past workout.</p></div>`;
}
function renderPrintPreview(){
  const w = $('#paperwrap'); if (!w) return;
  const html = sheetHTML();
  w.innerHTML = html ? `<div class="paper">${html}</div>` : `<div class="empty" style="background:none;color:var(--muted)">Your sheet preview appears here.</div>`;
  fitPaper();
}
function fitPaper(){
  const w = $('#paperwrap'), p = w && w.querySelector('.paper'); if (!p) return;
  p.style.zoom = Math.min(1, (w.clientWidth - 44) / 794).toFixed(3);
}
window.addEventListener('resize', fitPaper);
function doPrint(){
  const html = sheetHTML(); if (!html) return;
  $('#printRoot').innerHTML = html;
  const old = document.title; document.title = (S.print.title.trim() || 'Workout log') + ' - Repped';
  setTimeout(() => { window.print(); document.title = old; }, 50);
}

/* ---------------- rest timer + clocks ---------------- */
function startRest(sec){ S.rest = {end: Date.now() + sec * 1000, total: sec}; updateBars(); }
let audioCtx;
function beep(){
  if (!S.settings.sound) return;
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, .22, .44].forEach((d, i) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = i === 2 ? 1175 : 880; o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime + d; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.35, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .18); o.start(t); o.stop(t + .2); });
  } catch (e) {}
}
function updateBars(){
  const rb = $('#restbar');
  if (S.rest && S.active){
    const left = (S.rest.end - Date.now()) / 1000;
    if (left <= 0){ S.rest = null; rb.classList.remove('on'); beep(); toast('Rest over'); }
    else { rb.classList.add('on'); $('#restT').textContent = fmtDur(Math.ceil(left)); $('#restFill').style.width = (100 * (1 - left / S.rest.total)) + '%'; }
  } else rb.classList.remove('on');
  const showResume = S.active && !(S.view === 'editor' && S.ed?.mode === 'active') && S.dir;
  $('#resume').classList.toggle('on', !!showResume && !rb.classList.contains('on'));
  if (S.active){
    const el = fmtDur((Date.now() - new Date(S.active.start)) / 1000);
    if (showResume){ $('#resumeName').textContent = S.active.name; $('#resumeClock').textContent = el; }
    const c = $('#elapsed'); if (c) c.textContent = el;
  }
}
setInterval(updateBars, 250);

/* ---------------- modals ---------------- */
// buttons: [[label, value, classes]]. validate() may return false to keep it open.
function modal(html, buttons, wide, validate, focusSel){
  return new Promise(resolve => {
    const m = $('#modal');
    m.innerHTML = `<div class="mbox ${wide ? 'wide' : ''}" role="dialog" aria-modal="true">${html}<div class="mfoot">${buttons.map((b, i) => `<button class="btn ${b[2] || ''}" data-i="${i}">${esc(b[0])}</button>`).join('')}</div></div>`;
    m.classList.add('on');
    const close = v => { m.classList.remove('on'); m.innerHTML = ''; document.removeEventListener('keydown', onKey, true); resolve(v); };
    const onKey = ev => { if (ev.key === 'Escape'){ ev.stopPropagation(); close(buttons.find(b => b[1] == null) ? null : undefined); }
      if (ev.key === 'Enter' && ev.target.tagName !== 'TEXTAREA' && ev.target.tagName !== 'BUTTON'){ ev.preventDefault(); m.querySelector('.mfoot .btn:last-child').click(); } };
    document.addEventListener('keydown', onKey, true);
    m.querySelectorAll('.mfoot .btn').forEach(b => b.onclick = () => { const v = buttons[+b.dataset.i][1]; if (v != null && v !== false && validate && validate() === false) return; close(v); });
    m.onclick = ev => { if (ev.target === m) close(null); };
    const f = focusSel ? m.querySelector(focusSel) : m.querySelector('.mfoot .btn:last-child'); f?.focus(); if (f?.select) f.select();
  });
}
const confirmBox = (title, text, ok) => modal(`<h2>${esc(title)}</h2>${text ? `<p class="muted">${esc(text)}</p>` : ''}`, [['Cancel', false, 'ghost'], [ok, true, 'red']]);
async function promptBox(title, text, value){
  let out = null;
  const r = await modal(`<h2>${esc(title)}</h2>${text ? `<p class="muted" style="margin-bottom:10px">${esc(text)}</p>` : ''}<input class="inp" id="pbox" value="${esc(value ?? '')}">`,
    [['Cancel', null, 'ghost'], ['OK', 'ok', 'red']], false, () => { out = $('#pbox').value; return true; }, '#pbox');
  return r === 'ok' ? out : null;
}

/* ---------------- events ---------------- */
document.addEventListener('click', async ev => {
  const b = ev.target.closest('[data-act]'); if (!b || b.closest('#modal')) return;
  const act = b.dataset.act;
  if (b.closest('#editor')) return editorClick(b);
  switch (act){
    case 'nav': go(b.dataset.v); break;
    case 'pick': pickFolder(); break;
    case 'phone-start': (async () => { try { await connectHandle(await phoneRoot()); S._connectError = ''; S.view = 'workout'; render(); } catch (e) { S._connectError = 'Could not open the storage on this phone: ' + e.message; render(); } })(); break;
    case 'bk-export': exportBackup(); break;
    case 'bk-import': $('#bk-file').click(); break;
    case 'reconnect': reconnect(); break;
    case 'resume': S.ed = {mode: 'active', doc: S.active}; go('editor'); break;
    case 'start-empty': startWorkout(null); break;
    case 'tpl-new': S.ed = {mode: 'template', doc: {id: uid(), name: '', notes: '', exercises: []}}; go('editor'); setTimeout(() => $('#wname')?.focus(), 0); break;
    case 'tpl-open': openTemplate(b.dataset.id); break;
    case 'hist-open': openSession(b.dataset.id); break;
    case 'log-past': logPast(); break;
    case 'ex-open': go('exercise', b.dataset.id); break;
    case 'back-ex': if (S.active && S._fromEditor){ S._fromEditor = false; S.ed = {mode: 'active', doc: S.active}; go('editor'); } else go('exercises'); break;
    case 'ex-filter': S.exFilter = b.dataset.c; render(); break;
    case 'sk-branch': S.skBranch = b.dataset.b; try { localStorage.setItem('repped-sk-branch', S.skBranch); } catch (e) {} render(); break;
    case 'sk-open': openSkill(b.dataset.id); break;
    case 'sk-plan': buildSkillsWorkout(); break;
    case 'exn-new': if (await editExerciseModal(null)) render(); break;
    case 'exn-edit': if (await editExerciseModal(EXI.get(b.dataset.id))) render(); break;
    case 'exn-del': { const ex = EXI.get(b.dataset.id);
      if (exUsed(ex.id)){ toast(`${ex.name} is used in your templates or history, so it can't be deleted`, true); break; }
      if (await confirmBox(`Delete ${ex.name}?`, '', 'Delete')){ S.custom = S.custom.filter(c => c.id !== ex.id); await saveCustom(); go('exercises'); } break; }
    case 'rest-minus': if (S.rest){ S.rest.end -= 15000; S.rest.total = Math.max(1, S.rest.total - 15); updateBars(); } break;
    case 'rest-plus': if (S.rest){ S.rest.end += 15000; S.rest.total += 15; updateBars(); } break;
    case 'rest-skip': S.rest = null; updateBars(); break;
    case 'pr-add': S.print.series.push(b.dataset.id); render(); break;
    case 'pr-del': S.print.series.splice(+b.dataset.i, 1); render(); break;
    case 'pr-up': { const i = +b.dataset.i, s = S.print.series; if (i > 0){ [s[i - 1], s[i]] = [s[i], s[i - 1]]; render(); } break; }
    case 'pr-down': { const i = +b.dataset.i, s = S.print.series; if (i < s.length - 1){ [s[i + 1], s[i]] = [s[i], s[i + 1]]; render(); } break; }
    case 'pr-clear': S.print.series = []; render(); break;
    case 'pr-print': doPrint(); break;
    case 'starters-add': { const add = missingStarters(); for (const t of add) await saveTemplate(t); render(); toast(`Added ${andList(add.map(t => t.name))}`); break; }
    case 'starters-hide': S.settings.hideStarterOffer = true; await saveSettings(); render(); break;
  }
});
// editor "ex-detail" should come back to the workout
document.addEventListener('click', ev => { const b = ev.target.closest('[data-act="ex-detail"]'); if (b && S.ed?.mode === 'active') S._fromEditor = true; }, true);
document.addEventListener('input', ev => {
  const el = ev.target;
  if (el.closest('#editor')) return editorInput(el);
  if (el.id === 'exsearch'){ S.exSearch = el.value; S._refocusSearch = true; render(); return; }
  const P = S.print;
  if (el.id === 'ptitle'){ P.title = el.value; renderPrintPreview(); }
  else if (el.id === 'prep'){ P.repeat = Math.max(1, Math.min(20, parseInt(el.value) || 1)); renderPrintPreview(); }
  else if (el.id === 'pxs'){ P.extraSets = Math.max(0, Math.min(3, parseInt(el.value) || 0)); renderPrintPreview(); }
  else if (el.id === 'pxe'){ P.extraEx = Math.max(0, Math.min(4, parseInt(el.value) || 0)); renderPrintPreview(); }
});
document.addEventListener('change', async ev => {
  const el = ev.target, P = S.print;
  if (el.id === 'plast'){ P.last = el.checked; renderPrintPreview(); }
  else if (el.id === 'pnum'){ P.number = el.checked; renderPrintPreview(); }
  else if (el.id === 'srest'){ const v = parseDur(el.value); if (v != null){ S.settings.defaultRest = v; el.value = fmtDur(v); await saveSettings(); toast('Saved'); } }
  else if (el.id === 'ssound'){ S.settings.sound = el.checked; await saveSettings(); toast('Saved'); }
  else if (el.classList.contains('sin') && el.dataset.f === 't'){ const exb = el.closest('.exb'), tr = el.closest('tr'); if (exb && tr){ const e = S.ed.doc.exercises[+exb.dataset.ei], s = e.sets[+tr.dataset.si];
      const v = S.ed.mode === 'template' ? s.target?.t : s.t; el.value = v != null ? fmtDur(v) : ''; } }
});
document.addEventListener('keydown', ev => {
  if (ev.target.closest && ev.target.closest('#editor')) editorKey(ev);
  if ((ev.key === 'Enter' || ev.key === ' ') && ev.target.getAttribute?.('role') === 'button'){ ev.preventDefault(); ev.target.click(); }
});
document.addEventListener('change', ev => { if (ev.target.id === 'bk-file'){ const f = ev.target.files[0]; ev.target.value = ''; if (f) importBackup(f); } });
window.addEventListener('beforeunload', ev => { if (S.active){ try { localStorage.setItem('repped-active-backup', JSON.stringify({dir: S.dirName, session: S.active})); } catch (e) {} } });

/* ---------------- start up ---------------- */
if ('serviceWorker' in navigator && location.protocol === 'https:') { navigator.serviceWorker.register('sw.js').catch(() => {}); }
(async function init(){
  EXI = exIndex();
  if (window.__reppedTestDir){ await connectHandle(await window.__reppedTestDir); if (!S.templates.length && !S.history.length && window.__reppedStarters) for (const t of starterTemplates()) await saveTemplate(t); }
  else if (PHONE) { try { await connectHandle(await phoneRoot()); } catch (e) { S._connectError = 'Could not open the storage on this phone: ' + e.message; } }
  else {
    try {
      const h = await idb.get('dir');
      if (h){
        S._remembered = h;
        const perm = h.queryPermission ? await h.queryPermission({mode: 'readwrite'}) : 'granted';
        if (perm === 'granted'){ try { await connectHandle(h); } catch (e) { S._connectError = `Couldn't open ${h.name}. Plug in the USB stick, then open it again.`; } }
      }
    } catch (e) {}
  }
  if (S.active && S.connected){ S.view = 'editor'; S.ed = {mode: 'active', doc: S.active}; }
  render();
  window.Repped.ready = true;
  const p = host && host.takeWorkout ? host.takeWorkout() : null;
  if (p){ S._pending = p; openPending(); }
})();
</script>
